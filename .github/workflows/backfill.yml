name: バックフィル

# 過去の日足を取得して D1 へ流し込む。手動実行のみ。
#
# **Worker ではなくここで回す理由**
#   500 銘柄 × 10 年 ≒ 122 万行。D1 の無料枠（10 万行/日）では 2 週間かかり、
#   取得も約 2,450 リクエストになって Worker の実行時間に収まらない。

on:
  workflow_dispatch:
    inputs:
      from:
        description: '開始日 (YYYY-MM-DD)'
        required: true
      to:
        description: '終了日 (YYYY-MM-DD)'
        required: true
      apply:
        description: 'D1 へ実際に流し込む'
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: 取得して SQL を生成
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          npm run backfill -- \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}" \
            --out out/backfill.sql

      - name: 成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ inputs.from }}-${{ inputs.to }}
          path: out/backfill.sql
          retention-days: 14

      - name: D1 へ流し込む
        if: ${{ inputs.apply }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: packages/worker
        # **--env production を落とさないこと。** 付けないと wrangler は既定の
        # [[d1_databases]] を見に行く。本番の D1 を指しているのは
        # [[env.production.d1_databases]] のほう（package.json の
        # db:migrate:remote も同じ理由で --env production を付けている）。
        run: >-
          npx wrangler d1 execute invest-db --remote --env production
          --file=../../out/backfill.sql
