name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        # ネットワーク不要。APIキーも要らない。
        run: npm test
      - name: サンプルデータがスキーマに投入できるか
        run: node scripts/verify-seed.mjs
